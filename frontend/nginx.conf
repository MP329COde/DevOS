server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DevOS est une SPA routée côté client sur de vrais chemins (/work, /notes, /login, ...).
  # Sans ce fallback, nginx renverrait 404 sur un rechargement ou un lien profond puisqu'aucun
  # fichier physique ne correspond à ces chemins.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
